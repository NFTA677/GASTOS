# Configuración para Render (New + → Blueprint → elegir este repositorio).
services:
  - type: web
    name: nfta-gastos
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DB
        value: gastos
      # Estos tres los pide Render al crear el servicio; no se guardan en el repositorio.
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST
        sync: false
      # Opcionales: entrar con Google y registrar gastos desde Gmail.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
